 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KrishiSlot | Admin Login</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#123d28,#287747);
    padding:20px;
}
.login-box{
    background:#fff;
    width:100%;
    max-width:410px;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px #0003;
}
.logo{font-size:42px;text-align:center}
h1{text-align:center;color:#245c35;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:28px}
label{display:block;margin:16px 0 7px;font-weight:bold}
input{
    width:100%;padding:13px;border:1px solid #ccc;
    border-radius:8px;font-size:15px
}
button{
    width:100%;padding:13px;margin-top:22px;
    background:#245c35;color:white;border:0;
    border-radius:8px;font-size:16px;cursor:pointer
}
button:hover{background:#174526}
#message{text-align:center;margin-top:15px;color:#c62828}
.note{font-size:12px;color:#777;text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="login-box">
    <div class="logo">🌾</div>
    <h1>KrishiSlot Admin</h1>
    <p class="subtitle">Sign in to manage procurement</p>

    <form id="loginForm">
        <label for="username">Admin Username</label>
        <input id="username" type="text" placeholder="Enter username" required>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" required>

        <button type="submit" id="loginBtn">Login to Dashboard</button>
        <p id="message" role="alert"></p>
    </form>

    <p class="note">KrishiSlot • Admin Access</p>
</div>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
   
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Demo login only — replace with server-side authentication before deployment.
    if (username === "admin" && password === "Krishi@123") {
        sessionStorage.setItem("krishiAdminLoggedIn", "true");
        window.location.href = "admin.html";
    } else {
        message.textContent = "Invalid username or password.";
    }
});
</script>
</body>
</html>
